[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotuslearn-pipeline"
version = "0.1.0"
description = "LotusLearn analytical event ingestion, quality gates, and relational SQLite metrics pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20.0",
    "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "ruff>=0.1.0",
    "build>=0.9.0",
    "wheel",
]

[project.scripts]
lotuslearn-pipeline = "lotuslearn_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lotuslearn_pipeline = [
    "resources/*.json",
    "sql/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests", "pipelines/tests"]
pythonpath = ["src", "pipelines/src"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
