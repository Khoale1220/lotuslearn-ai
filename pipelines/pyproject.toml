[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lotuslearn-pipelines"
version = "0.1.0"
description = "LotusLearn analytical event ingestion, quality gates, and relational SQLite metrics pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["pipelines/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
