    <script>
      (function() {
        try {
          var saved = localStorage.getItem('lotuslearn-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] dark:bg-[#0B0F17] dark:text-[#F1F5F9] antialiased selection:bg-blue-100 selection:text-blue-900 transition-colors duration-150">

    <script type="module" src="/src/main.tsx"></script>
  </body>
