name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node_validate:
    name: Node Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run full Node regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

  python_pipeline:
    name: Data Engineering Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: lotuslearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lotuslearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LOTUSLEARN_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test
      LOTUSLEARN_TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify deterministic reliability fixture
        run: npm run fixtures:verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./pipelines[dev]"
          python -m pip check

      - name: Python lint
        run: ruff check pipelines

      - name: Run Data Engineering test suite
        run: python -m pytest pipelines/tests

      - name: Build Python distribution
        run: python -m build pipelines

      - name: Verify non-editable wheel installation outside source tree
        run: |
          python -m pip install --force-reinstall pipelines/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import lotuslearn_pipeline; print('Installed package import successful')"
          lotuslearn-pipeline --help
          lotuslearn-pipeline --db "$LOTUSLEARN_DATABASE_URL" --command verify
          lotuslearn-pipeline --db "$LOTUSLEARN_DATABASE_URL" --migration-status
          lotuslearn-pipeline --db "$LOTUSLEARN_DATABASE_URL" --metrics

      - name: Run SQLite end-to-end smoke test
        run: npm run pipeline:run
        env:
          LOTUSLEARN_DATABASE_URL: ":memory:"

      - name: Run PostgreSQL end-to-end smoke test
        run: npm run pipeline:run:postgres

  analytics_transformation:
    name: Analytics Transformation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: lotuslearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lotuslearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LOTUSLEARN_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test
      LOTUSLEARN_TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test

      LOTUSLEARN_DB_HOST: localhost
      LOTUSLEARN_DB_PORT: "5432"
      LOTUSLEARN_DB_USER: postgres
      LOTUSLEARN_DB_PASSWORD: postgres_ci_password
      LOTUSLEARN_DB_NAME: lotuslearn_test

      LOTUSLEARN_ANALYTICS_SCHEMA: analytics
      LOTUSLEARN_OPERATIONAL_SCHEMA: public

      DBT_MANIFEST_PATH: analytics/target/manifest.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify deterministic reliability fixture
        run: npm run fixtures:verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ingestion pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./pipelines[dev]"
          python -m pip check

      - name: Install pinned dbt analytics dependencies
        run: |
          python -m pip install -r analytics/requirements.txt
          python -m pip check

      - name: Load deterministic reliability fixtures into PostgreSQL
        run: python analytics/scripts/load_reliability_fixtures_to_postgres.py

      - name: Verify dbt connection
        run: |
          dbt debug \
            --project-dir analytics \
            --profiles-dir analytics

      - name: Parse dbt project with warnings as errors
        run: |
          dbt parse \
            --project-dir analytics \
            --profiles-dir analytics \
            --warn-error

      - name: Compile dbt project with warnings as errors
        run: |
          dbt compile \
            --project-dir analytics \
            --profiles-dir analytics \
            --warn-error

      - name: Run discovered dbt unit tests
        run: |
          dbt test \
            --project-dir analytics \
            --profiles-dir analytics \
            --select "test_type:unit" \
            --warn-error

      - name: Build analytical models and run data-quality tests
        run: |
          dbt build \
            --project-dir analytics \
            --profiles-dir analytics \
            --exclude "test_type:unit" \
            --warn-error

      - name: Verify operational to analytical parity
        run: python analytics/scripts/verify_dbt_parity.py

      - name: Generate dbt documentation
        run: |
          dbt docs generate \
            --project-dir analytics \
            --profiles-dir analytics \
            --warn-error