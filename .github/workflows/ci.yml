name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node_validate:
    name: Node Quality Gates (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated Node regression tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  python_pipeline:
    name: Data Engineering Pipeline (PostgreSQL 18, SQLite, Parity, Metrics)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: lotuslearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lotuslearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      LOTUSLEARN_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test
      LOTUSLEARN_TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test
      LOTUSLEARN_PG_HOST: localhost
      LOTUSLEARN_PG_PORT: 5432
      LOTUSLEARN_PG_USER: postgres
      LOTUSLEARN_PG_PASSWORD: postgres_ci_password
      LOTUSLEARN_PG_DBNAME: lotuslearn_test
      LOTUSLEARN_PG_SCHEMA: analytics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for cross-language producer tests)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Deterministic Reliability Fixtures (Zero Drift Gate)
        run: npm run fixtures:verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./pipelines[dev]"

      - name: Python Lint (ruff)
        run: ruff check pipelines

      - name: Python Automated Pipeline Tests (pytest)
        run: pytest pipelines/tests

      - name: Build Distribution Wheel
        run: python -m build pipelines

      - name: Verify Non-Editable Package Installation from Wheel
        run: |
          pip install --force-reinstall pipelines/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import lotuslearn_pipeline; print('Installed package import successful')"
          lotuslearn-pipeline --help
          lotuslearn-pipeline --db "$LOTUSLEARN_DATABASE_URL" --command verify
          lotuslearn-pipeline --db "$LOTUSLEARN_DATABASE_URL" --migration-status
          lotuslearn-pipeline --db "$LOTUSLEARN_DATABASE_URL" --metrics

      - name: Run SQLite End-to-End Pipeline Smoke Test
        run: npm run pipeline:run
        env:
          LOTUSLEARN_DATABASE_URL: ":memory:"

      - name: Run PostgreSQL End-to-End Pipeline Smoke Test
        run: npm run pipeline:run:postgres

      - name: Verify dbt Project Compilation
        run: npm run dbt:parse

      - name: Run dbt Build (Models and Data Quality Tests)
        run: npm run dbt:build

      - name: Generate dbt Documentation
        run: dbt docs generate --project-dir analytics --profiles-dir analytics

      - name: Reconcile Pipeline Metrics against dbt Marts
        run: npm run dbt:reconcile

      - name: Upload dbt Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          path: |
            analytics/target/manifest.json
            analytics/target/run_results.json
            analytics/target/catalog.json
          retention-days: 14

