name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  node_validate:
    name: Node Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm for reproducible installs
        run: |
          npm install --global npm@10.9.9
          test "$(npm --version)" = "10.9.9"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run full Node regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

  metadata_governance:
    name: Metadata Governance Policy Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres_baseline:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: lotuslearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lotuslearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      postgres_candidate:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: lotuslearn_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lotuslearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

      BASE_DATABASE_URL: >-
        postgresql://postgres:postgres_ci_password@127.0.0.1:5432/lotuslearn_test

      CANDIDATE_DATABASE_URL: >-
        postgresql://postgres:postgres_ci_password@127.0.0.1:5433/lotuslearn_test

      LOTUSLEARN_ANALYTICS_SCHEMA: analytics
      LOTUSLEARN_OPERATIONAL_SCHEMA: public
      LOTUSLEARN_DBT_THREADS: "4"

    steps:
      - name: Checkout trusted baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create isolated Python environments
        shell: bash
        run: |
          set -euo pipefail

          python -m venv "$RUNNER_TEMP/lotuslearn-base-venv"
          python -m venv "$RUNNER_TEMP/lotuslearn-candidate-venv"

          BASE_PY="$RUNNER_TEMP/lotuslearn-base-venv/bin/python"
          CANDIDATE_PY="$RUNNER_TEMP/lotuslearn-candidate-venv/bin/python"

          "$BASE_PY" -m pip install \
            --disable-pip-version-check \
            -e "./baseline/pipelines[dev]" \
            -r "./baseline/analytics/requirements.txt"

          "$CANDIDATE_PY" -m pip install \
            --disable-pip-version-check \
            -e "./candidate/pipelines[dev]" \
            -r "./candidate/analytics/requirements.txt"

          "$BASE_PY" -m pip check
          "$CANDIDATE_PY" -m pip check

      - name: Verify governance implementation tests
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_PY="$RUNNER_TEMP/lotuslearn-candidate-venv/bin/python"

          "$CANDIDATE_PY" -m ruff check \
            candidate/pipelines/src/lotuslearn_pipeline/metadata.py \
            candidate/pipelines/src/lotuslearn_pipeline/metadata_drift.py \
            candidate/pipelines/src/lotuslearn_pipeline/metadata_policy.py \
            candidate/pipelines/src/lotuslearn_pipeline/metadata_ci_gate.py \
            candidate/pipelines/tests/test_metadata_policy.py \
            candidate/pipelines/tests/test_metadata_ci_gate.py

          PYTHONDONTWRITEBYTECODE=1 \
          "$CANDIDATE_PY" -m pytest \
            -q \
            -p no:cacheprovider \
            candidate/pipelines/tests/test_metadata_policy.py \
            candidate/pipelines/tests/test_metadata_ci_gate.py

      - name: Apply trusted baseline migrations
        shell: bash
        run: |
          set -euo pipefail

          BASE_BIN="$RUNNER_TEMP/lotuslearn-base-venv/bin"

          "$BASE_BIN/lotuslearn-pipeline" \
            --db "$BASE_DATABASE_URL" \
            --command migrate

          "$BASE_BIN/lotuslearn-pipeline" \
            --db "$BASE_DATABASE_URL" \
            --command verify

      - name: Apply candidate migrations
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_BIN="$RUNNER_TEMP/lotuslearn-candidate-venv/bin"

          "$CANDIDATE_BIN/lotuslearn-pipeline" \
            --db "$CANDIDATE_DATABASE_URL" \
            --command migrate

          "$CANDIDATE_BIN/lotuslearn-pipeline" \
            --db "$CANDIDATE_DATABASE_URL" \
            --command verify

      - name: Parse trusted baseline dbt graph
        shell: bash
        env:
          LOTUSLEARN_DB_HOST: 127.0.0.1
          LOTUSLEARN_DB_PORT: "5432"
          LOTUSLEARN_DB_USER: postgres
          LOTUSLEARN_DB_PASSWORD: postgres_ci_password
          LOTUSLEARN_DB_NAME: lotuslearn_test
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/lotuslearn-base-venv/bin/dbt" parse \
            --project-dir baseline/analytics \
            --profiles-dir baseline/analytics \
            --warn-error \
            --no-partial-parse

          test -s baseline/analytics/target/manifest.json

      - name: Parse candidate dbt graph
        shell: bash
        env:
          LOTUSLEARN_DB_HOST: 127.0.0.1
          LOTUSLEARN_DB_PORT: "5433"
          LOTUSLEARN_DB_USER: postgres
          LOTUSLEARN_DB_PASSWORD: postgres_ci_password
          LOTUSLEARN_DB_NAME: lotuslearn_test
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/lotuslearn-candidate-venv/bin/dbt" parse \
            --project-dir candidate/analytics \
            --profiles-dir candidate/analytics \
            --warn-error \
            --no-partial-parse

          test -s candidate/analytics/target/manifest.json

      - name: Extract metadata with trusted baseline extractor
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/metadata-governance"

          BASE_PY="$RUNNER_TEMP/lotuslearn-base-venv/bin/python"

          SNAPSHOT_DATABASE_URL="$BASE_DATABASE_URL" \
          SNAPSHOT_MANIFEST="$GITHUB_WORKSPACE/baseline/analytics/target/manifest.json" \
          SNAPSHOT_REPO="$GITHUB_WORKSPACE/baseline" \
          SNAPSHOT_OUTPUT="$RUNNER_TEMP/metadata-governance/baseline.json" \
          "$BASE_PY" - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          from lotuslearn_pipeline.metadata import (
              extract_metadata_snapshot,
              validate_metadata_snapshot,
          )

          snapshot = extract_metadata_snapshot(
              database_url=os.environ["SNAPSHOT_DATABASE_URL"],
              manifest_path=Path(os.environ["SNAPSHOT_MANIFEST"]),
              repo_root=Path(os.environ["SNAPSHOT_REPO"]),
          )

          validation = validate_metadata_snapshot(snapshot)

          if not validation.is_valid:
              raise RuntimeError(
                  "Trusted baseline metadata validation failed: "
                  + "; ".join(validation.errors)
              )

          Path(os.environ["SNAPSHOT_OUTPUT"]).write_text(
              json.dumps(
                  snapshot.to_dict(),
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PYTHON

          SNAPSHOT_DATABASE_URL="$CANDIDATE_DATABASE_URL" \
          SNAPSHOT_MANIFEST="$GITHUB_WORKSPACE/candidate/analytics/target/manifest.json" \
          SNAPSHOT_REPO="$GITHUB_WORKSPACE/candidate" \
          SNAPSHOT_OUTPUT="$RUNNER_TEMP/metadata-governance/candidate.json" \
          "$BASE_PY" - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          from lotuslearn_pipeline.metadata import (
              extract_metadata_snapshot,
              validate_metadata_snapshot,
          )

          snapshot = extract_metadata_snapshot(
              database_url=os.environ["SNAPSHOT_DATABASE_URL"],
              manifest_path=Path(os.environ["SNAPSHOT_MANIFEST"]),
              repo_root=Path(os.environ["SNAPSHOT_REPO"]),
          )

          validation = validate_metadata_snapshot(snapshot)

          if not validation.is_valid:
              raise RuntimeError(
                  "Candidate metadata validation failed: "
                  + "; ".join(validation.errors)
              )

          Path(os.environ["SNAPSHOT_OUTPUT"]).write_text(
              json.dumps(
                  snapshot.to_dict(),
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PYTHON

      - name: Evaluate metadata governance with trusted baseline policy
        id: metadata_gate
        shell: bash
        run: |
          set -uo pipefail

          BASE_PY="$RUNNER_TEMP/lotuslearn-base-venv/bin/python"
          EVIDENCE_DIR="$RUNNER_TEMP/metadata-governance"

          set +e

          "$BASE_PY" \
            -m lotuslearn_pipeline.metadata_ci_gate \
            compare \
            --baseline "$EVIDENCE_DIR/baseline.json" \
            --candidate "$EVIDENCE_DIR/candidate.json" \
            --baseline-commit "$BASE_SHA" \
            --candidate-commit "$CANDIDATE_SHA" \
            --evidence "$EVIDENCE_DIR/evidence.json"

          rc=$?

          set -e

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ -f "$EVIDENCE_DIR/evidence.json" ]; then
            cat "$EVIDENCE_DIR/evidence.json"
          fi

          exit 0

      - name: Upload sanitized metadata governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-governance-evidence
          path: ${{ runner.temp }}/metadata-governance/evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce metadata governance decision
        if: always()
        shell: bash
        env:
          GOVERNANCE_EXIT_CODE: ${{ steps.metadata_gate.outputs.exit_code }}
        run: |
          set -euo pipefail

          if [ -z "${GOVERNANCE_EXIT_CODE:-}" ]; then
            echo "Metadata governance produced no decision."
            exit 4
          fi

          case "$GOVERNANCE_EXIT_CODE" in
            0)
              echo "Metadata governance: PASS"
              ;;
            2)
              echo "Metadata governance: BLOCK"
              exit 2
              ;;
            3)
              echo "Metadata governance: REVIEW is blocking by default"
              exit 3
              ;;
            *)
              echo "Metadata governance integrity failure: $GOVERNANCE_EXIT_CODE"
              exit "$GOVERNANCE_EXIT_CODE"
              ;;
          esac


  python_pipeline:
    name: Data Engineering Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: lotuslearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lotuslearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LOTUSLEARN_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test
      LOTUSLEARN_TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify deterministic reliability fixtures
        run: npm run fixtures:verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./pipelines[dev]"
          python -m pip check

      - name: Install pinned dbt analytics dependencies
        run: |
          python -m pip install -r analytics/requirements.txt
          python -m pip check

      - name: Generate dbt metadata manifest
        env:
          LOTUSLEARN_DB_HOST: localhost
          LOTUSLEARN_DB_PORT: "5432"
          LOTUSLEARN_DB_USER: postgres
          LOTUSLEARN_DB_PASSWORD: postgres_ci_password
          LOTUSLEARN_DB_NAME: lotuslearn_test
          LOTUSLEARN_ANALYTICS_SCHEMA: analytics
        run: |
          dbt parse \
            --project-dir analytics \
            --profiles-dir analytics \
            --warn-error \
            --no-partial-parse
          test -s analytics/target/manifest.json

      - name: Python lint
        run: ruff check pipelines

      - name: Run DE-04A metadata regression gate
        run: python -m pytest pipelines/tests/test_metadata.py -v -rs

      - name: Run Data Engineering test suite
        run: python -m pytest pipelines/tests

      - name: Build Python distribution
        run: python -m build pipelines

      - name: Verify non-editable wheel installation outside source tree
        run: |
          python -m pip install --force-reinstall pipelines/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import lotuslearn_pipeline; print('Installed package import successful')"
          lotuslearn-pipeline --help
          lotuslearn-pipeline --db "$LOTUSLEARN_DATABASE_URL" --command verify
          lotuslearn-pipeline --db "$LOTUSLEARN_DATABASE_URL" --migration-status
          lotuslearn-pipeline --db "$LOTUSLEARN_DATABASE_URL" --metrics

      - name: Run SQLite end-to-end smoke test
        run: npm run pipeline:run
        env:
          LOTUSLEARN_DATABASE_URL: ":memory:"

      - name: Run PostgreSQL end-to-end smoke test
        run: npm run pipeline:run:postgres

  analytics_transformation:
    name: Analytics Transformation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: lotuslearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lotuslearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LOTUSLEARN_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test
      LOTUSLEARN_TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/lotuslearn_test
      LOTUSLEARN_DB_HOST: localhost
      LOTUSLEARN_DB_PORT: "5432"
      LOTUSLEARN_DB_USER: postgres
      LOTUSLEARN_DB_PASSWORD: postgres_ci_password
      LOTUSLEARN_DB_NAME: lotuslearn_test
      LOTUSLEARN_ANALYTICS_SCHEMA: analytics
      LOTUSLEARN_OPERATIONAL_SCHEMA: public
      DBT_MANIFEST_PATH: analytics/target/manifest.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify deterministic reliability fixtures
        run: npm run fixtures:verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ingestion pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./pipelines[dev]"
          python -m pip check

      - name: Install pinned dbt analytics dependencies
        run: |
          python -m pip install -r analytics/requirements.txt
          python -m pip check

      - name: Load deterministic reliability fixtures into PostgreSQL
        run: python analytics/scripts/load_reliability_fixtures_to_postgres.py

      - name: Verify dbt connection
        run: |
          dbt debug \
            --project-dir analytics \
            --profiles-dir analytics

      - name: Parse dbt project with warnings as errors
        run: |
          dbt parse \
            --project-dir analytics \
            --profiles-dir analytics \
            --warn-error

      - name: Compile dbt project with warnings as errors
        run: |
          dbt compile \
            --project-dir analytics \
            --profiles-dir analytics \
            --warn-error

      - name: Build analytical DAG and run unit and data tests
        run: |
          dbt build \
            --project-dir analytics \
            --profiles-dir analytics \
            --warn-error

      - name: Verify operational to analytical parity
        run: python analytics/scripts/verify_dbt_parity.py

      - name: Generate dbt documentation
        run: |
          dbt docs generate \
            --project-dir analytics \
            --profiles-dir analytics \
            --warn-error
