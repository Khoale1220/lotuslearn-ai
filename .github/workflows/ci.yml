name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node_validate:
    name: Node Quality Gates (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated Node regression tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  python_pipeline:
    name: Data Engineering Pipeline (Python, Schema, SQLite, Metrics)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for cross-language producer tests)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./pipelines[dev]"

      - name: Python Lint (ruff)
        run: ruff check pipelines

      - name: Python Automated Pipeline Tests (pytest)
        run: pytest pipelines/tests

      - name: Build Distribution Wheel
        run: python -m build pipelines

      - name: Verify Non-Editable Package Installation from Wheel
        run: |
          pip install --force-reinstall pipelines/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import lotuslearn_pipeline; print('Installed package import successful')"
          lotuslearn-pipeline --help

      - name: Run DE-01 End-to-End Pipeline Smoke Test
        run: npm run pipeline:run
