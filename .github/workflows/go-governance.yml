name: Go Governance Query

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-go:
    name: Go Governance Query Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/governance-query

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/governance-query/go.mod
          cache-dependency-path: services/governance-query/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Run Go tests with race detector
        run: go test -race ./...
