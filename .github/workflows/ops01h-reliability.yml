name: OPS-01H Monitoring Reliability

on:
  pull_request:
    paths:
      - '.github/workflows/ops01h-reliability.yml'
      - 'monitoring/smoke_alert_delivery.py'
      - 'monitoring/RELIABILITY.md'
      - 'pipelines/tests/test_execution_exporter_recovery.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops01h-reliability.yml'
      - 'monitoring/smoke_alert_delivery.py'
      - 'monitoring/RELIABILITY.md'
      - 'pipelines/tests/test_execution_exporter_recovery.py'

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python tooling
        run: python -m pip install -e './pipelines[dev]'
      - name: Python reliability gates
        run: |
          python -m ruff check monitoring/smoke_alert_delivery.py pipelines/tests/test_execution_exporter_recovery.py
          python -m ruff format --check monitoring/smoke_alert_delivery.py pipelines/tests/test_execution_exporter_recovery.py
          python -m pytest -q pipelines/tests/test_execution_exporter.py pipelines/tests/test_execution_exporter_recovery.py
      - name: Isolated Alertmanager webhook delivery and recovery
        run: python monitoring/smoke_alert_delivery.py
