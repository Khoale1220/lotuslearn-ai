lotuslearn_postgres:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('LOTUSLEARN_PG_HOST', 'localhost') }}"
      user: "{{ env_var('LOTUSLEARN_PG_USER', 'postgres') }}"
      password: "{{ env_var('LOTUSLEARN_PG_PASSWORD', 'postgres_ci_password') }}"
      port: "{{ env_var('LOTUSLEARN_PG_PORT', '5432') | int }}"
      dbname: "{{ env_var('LOTUSLEARN_PG_DBNAME', 'lotuslearn_test') }}"
      schema: "{{ env_var('LOTUSLEARN_PG_SCHEMA', 'analytics') }}"
      threads: 4
      keepalives_idle: 0
    ci:
      type: postgres
      host: "{{ env_var('LOTUSLEARN_PG_HOST', 'localhost') }}"
      user: "{{ env_var('LOTUSLEARN_PG_USER', 'postgres') }}"
      password: "{{ env_var('LOTUSLEARN_PG_PASSWORD', 'postgres_ci_password') }}"
      port: "{{ env_var('LOTUSLEARN_PG_PORT', '5432') | int }}"
      dbname: "{{ env_var('LOTUSLEARN_PG_DBNAME', 'lotuslearn_test') }}"
      schema: "{{ env_var('LOTUSLEARN_PG_SCHEMA', 'analytics') }}"
      threads: 4
      keepalives_idle: 0
