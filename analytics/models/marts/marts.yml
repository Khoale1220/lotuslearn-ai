version: 2

models:
  - name: dim_analysis_run
    description: "Dimension representing stable analysis run attributes."
    config:
      contract:
        enforced: true
      access: public
    meta:
      grain: "one row per analysis run"
    columns:
      - name: run_id
        data_type: text
        description: "Primary identifier of the analysis run."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null

      - name: dataset_fingerprint
        data_type: text
        description: "Fingerprint representing the sanitized submission payload."
        constraints:
          - type: not_null

      - name: submission_count
        data_type: integer
        description: "Total submissions analyzed."
        constraints:
          - type: not_null

      - name: subject
        data_type: text
        description: "Academic subject."
        constraints:
          - type: not_null

      - name: grade_level
        data_type: text
        description: "Cohort grade level."
        constraints:
          - type: not_null

      - name: total_duration_ms
        data_type: integer
        description: "Execution duration in milliseconds."

      - name: execution_mode
        data_type: text
        description: "Pipeline execution mode."

      - name: occurred_at
        data_type: timestamp with time zone
        description: "Domain analysis timestamp."
        constraints:
          - type: not_null

  - name: fct_teacher_decisions
    description: "Immutable educator review actions."
    config:
      contract:
        enforced: true
      access: public
    meta:
      grain: "one row per immutable teacher decision event"
    columns:
      - name: event_id
        data_type: text
        description: "Deterministic analytical event identifier."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null

      - name: analysis_run_id
        data_type: text
        description: "Analysis run identifier."
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_analysis_run')
                field: run_id

      - name: target_type
        data_type: text
        description: "Type of reviewed entity."
        constraints:
          - type: not_null

      - name: target_id
        data_type: text
        description: "Identifier of the reviewed entity."
        constraints:
          - type: not_null

      - name: teacher_decision
        data_type: text
        description: "Recorded educator action."
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - accepted
                  - edited
                  - dismissed

      - name: notes
        data_type: text
        description: "Optional educator notes."

      - name: decision_recorded_at
        data_type: timestamp with time zone
        description: "Timestamp when the decision was recorded."
        constraints:
          - type: not_null

  - name: fct_student_findings
    description: "Student observations within diagnosed misconception clusters."
    config:
      contract:
        enforced: true
      access: public
    meta:
      grain: "one student finding within one misconception cluster and analysis run"
    columns:
      - name: analysis_run_id
        data_type: text
        description: "Analysis run identifier."
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_analysis_run')
                field: run_id

      - name: cluster_id
        data_type: text
        description: "Misconception cluster identifier."
        constraints:
          - type: not_null

      - name: student_id
        data_type: text
        description: "Run-scoped student pseudonym."
        constraints:
          - type: not_null

      - name: run_scoped_student_key
        data_type: text
        description: "Identity key scoped to one analysis run."
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: fct_ingestion_attempts
    description: "Durable logical ingestion attempts recorded by the operational audit log."
    config:
      contract:
        enforced: true
      access: public
    meta:
      grain: "one row per durable ingestion attempt_id"
    columns:
      - name: attempt_id
        data_type: bigint
        description: "Durable ingestion audit attempt identifier."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null

      - name: event_id
        data_type: text
        description: "Analytical event identifier."
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: event_type
        data_type: text
        description: "Analytical event type."
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: outcome
        data_type: text
        description: "Durable logical ingestion outcome."
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - accepted
                  - duplicate
                  - conflict
                  - rejected

      - name: rejection_reason
        data_type: text
        description: "Diagnostic reason associated with a non-accepted attempt."

      - name: processed_at
        data_type: timestamp with time zone
        description: "Timestamp when the logical ingestion attempt completed."
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: mart_run_quality
    description: "Run-level analytical health, verification, and educator review measures."
    config:
      contract:
        enforced: true
      access: public
    meta:
      grain: "one row per analysis run"
    columns:
      - name: run_id
        data_type: text
        description: "Analysis run identifier."
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null

      - name: dataset_fingerprint
        data_type: text
        description: "Dataset fingerprint."
        constraints:
          - type: not_null

      - name: subject
        data_type: text
        description: "Academic subject."
        constraints:
          - type: not_null

      - name: grade_level
        data_type: text
        description: "Grade level."
        constraints:
          - type: not_null

      - name: submission_count
        data_type: integer
        description: "Submission count."
        constraints:
          - type: not_null

      - name: finding_count
        data_type: integer
        description: "Misconception cluster count."
        constraints:
          - type: not_null

      - name: student_appearances_count
        data_type: integer
        description: "Distinct run-scoped student count."
        constraints:
          - type: not_null

      - name: teacher_decisions_reviewed_count
        data_type: integer
        description: "Current educator decisions reviewed."
        constraints:
          - type: not_null

      - name: teacher_modifications_count
        data_type: integer
        description: "Current decisions edited or dismissed."
        constraints:
          - type: not_null

      - name: educator_modification_rate
        data_type: numeric(12,4)
        description: "Ratio of edited or dismissed decisions to reviewed decisions."

      - name: verification_status
        data_type: text
        description: "Verification status."
        constraints:
          - type: not_null

      - name: is_fully_verified
        data_type: boolean
        description: "Whether all verification checks passed."
        constraints:
          - type: not_null

      - name: quotes_grounded_count
        data_type: integer
        description: "Grounded quote count."
        constraints:
          - type: not_null

      - name: quotes_flagged_count
        data_type: integer
        description: "Flagged quote count."
        constraints:
          - type: not_null

      - name: occurred_at
        data_type: timestamp with time zone
        description: "Domain analysis timestamp."
        constraints:
          - type: not_null

  - name: mart_concept_prevalence
    description: "Concept prevalence by misconception cluster within an analysis run."
    config:
      contract:
        enforced: true
      access: public
    meta:
      grain: "one row per misconception cluster within an analysis run"
    columns:
      - name: analysis_run_id
        data_type: text
        description: "Analysis run identifier."
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_analysis_run')
                field: run_id

      - name: cluster_id
        data_type: text
        description: "Misconception cluster identifier."
        constraints:
          - type: not_null

      - name: concept
        data_type: text
        description: "Concept name."
        constraints:
          - type: not_null

      - name: teaching_priority
        data_type: text
        description: "Teaching priority."
        constraints:
          - type: not_null

      - name: affected_student_count
        data_type: integer
        description: "Number of affected students."
        constraints:
          - type: not_null

      - name: submission_count
        data_type: integer
        description: "Total submissions in the analysis run."
        constraints:
          - type: not_null

      - name: prevalence_rate
        data_type: numeric(12,4)
        description: "Affected student count divided by submission count."