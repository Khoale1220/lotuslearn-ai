version: 2

sources:
  - name: raw_lotuslearn
    description: "Raw relational analytical tables persisted by the LotusLearn Python ingestion pipeline in PostgreSQL."
    schema: "{{ env_var('LOTUSLEARN_RAW_SCHEMA', 'public') }}"
    tables:
      - name: analysis_runs
        description: "Diagnostic assessment runs recording submission metadata and verification."
        columns:
          - name: run_id
            description: "Unique analysis run identifier."
            tests:
              - unique
              - not_null
          - name: dataset_fingerprint
            description: "SHA-256 fingerprint of the sanitized submission dataset."
            data_tests:
              - not_null
          - name: submission_count
            description: "Total number of student submissions in this run."
            data_tests:
              - not_null
          - name: subject
            description: "Curricular subject (e.g., Mathematics, Science, English)."
            data_tests:
              - not_null
          - name: grade_level
            description: "Target educational grade level."
            data_tests:
              - not_null
          - name: occurred_at
            description: "UTC timestamp when the run event was generated."
            data_tests:
              - not_null

      - name: analytical_events
        description: "Immutable append-only ledger of canonical analytical events."
        columns:
          - name: event_id
            description: "Primary key UUID of the analytical event."
            data_tests:
              - unique
              - not_null
          - name: schema_version
            description: "Draft 2020-12 event contract schema version."
            data_tests:
              - not_null
          - name: event_type
            description: "Standard lifecycle event type."
            data_tests:
              - not_null
              - accepted_values:
                  values: ['RUN_STARTED', 'ANALYSIS_PRODUCED', 'DECISION_RECORDED']
          - name: analysis_run_id
            description: "Foreign key to analysis_runs."
            data_tests:
              - not_null
          - name: occurred_at
            description: "UTC timestamp when the event occurred."
            data_tests:
              - not_null

      - name: misconception_clusters
        description: "Detected student misconception clusters per analysis run."
        columns:
          - name: analysis_run_id
            description: "Foreign key to analysis_runs."
            data_tests:
              - not_null
          - name: cluster_id
            description: "Identifier for the misconception cluster within the run."
            data_tests:
              - not_null
          - name: concept
            description: "Mathematical or pedagogical concept title."
            data_tests:
              - not_null
          - name: teaching_priority
            description: "Pedagogical intervention priority tier."
            data_tests:
              - not_null
              - accepted_values:
                  values: ['immediate', 'guided_group', 'reinforce', 'monitor']
          - name: affected_student_count
            description: "Count of students exhibiting this misconception."
            data_tests:
              - not_null

      - name: student_findings
        description: "Normalized student-to-cluster associations maintaining run-scoped pseudonymity."
        columns:
          - name: analysis_run_id
            data_tests:
              - not_null
          - name: cluster_id
            data_tests:
              - not_null
          - name: student_id
            description: "Run-scoped student pseudonym."
            data_tests:
              - not_null

      - name: instructional_groups
        description: "Synthesized instructional support groups."
        columns:
          - name: analysis_run_id
            data_tests:
              - not_null
          - name: group_id
            data_tests:
              - not_null
          - name: group_name
            data_tests:
              - not_null
          - name: student_count
            data_tests:
              - not_null
          - name: suggested_activity
            data_tests:
              - not_null

      - name: group_memberships
        description: "Student allocations to instructional groups."
        columns:
          - name: analysis_run_id
            data_tests:
              - not_null
          - name: group_id
            data_tests:
              - not_null
          - name: student_id
            data_tests:
              - not_null

      - name: verifications
        description: "Dual-model and deterministic audit verification results."
        columns:
          - name: analysis_run_id
            data_tests:
              - unique
              - not_null
          - name: overall_status
            data_tests:
              - not_null
              - accepted_values:
                  values: ['verified', 'partially_verified', 'needs_review']
          - name: coverage_passed
            data_tests:
              - not_null
          - name: cluster_math_passed
            data_tests:
              - not_null
          - name: group_partition_passed
            data_tests:
              - not_null

      - name: teacher_decisions
        description: "Immutable historical stream of educator decisions and overrides."
        columns:
          - name: event_id
            description: "Analytical event ID uniquely identifying this decision action."
            data_tests:
              - unique
              - not_null
          - name: analysis_run_id
            data_tests:
              - not_null
          - name: target_type
            data_tests:
              - not_null
          - name: target_id
            data_tests:
              - not_null
          - name: teacher_decision
            data_tests:
              - not_null
              - accepted_values:
                  values: ['accepted', 'edited', 'dismissed']
          - name: recorded_at
            data_tests:
              - not_null

      - name: current_teacher_decisions
        description: "Authoritative relational projection of current educator decision state."
        columns:
          - name: analysis_run_id
            data_tests:
              - not_null
          - name: target_type
            data_tests:
              - not_null
          - name: target_id
            data_tests:
              - not_null
          - name: teacher_decision
            data_tests:
              - not_null
              - accepted_values:
                  values: ['accepted', 'edited', 'dismissed']
          - name: updated_at
            data_tests:
              - not_null

      - name: ingestion_audit_log
        description: "Audit trail of every event ingestion attempt and outcome."
        columns:
          - name: attempt_id
            data_tests:
              - unique
              - not_null
          - name: event_id
            data_tests:
              - not_null
          - name: outcome
            data_tests:
              - not_null
              - accepted_values:
                  values: ['accepted', 'duplicate', 'conflict', 'rejected']
          - name: processed_at
            data_tests:
              - not_null
