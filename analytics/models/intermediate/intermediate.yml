version: 2

models:
  - name: int_teacher_decision_ranked
    description: "Independently reconstructed current teacher decision state per target, derived from immutable event history using decision_recorded_at descending and event_id tie-breaking descending."
    meta:
      grain: "one row per teacher decision target per analysis run"
    columns:
      - name: event_id
        description: "Event ID of the winning decision."
        tests:
          - unique
          - not_null

      - name: analysis_run_id
        tests:
          - not_null

      - name: target_type
        tests:
          - not_null

      - name: target_id
        tests:
          - not_null

      - name: teacher_decision
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['accepted', 'edited', 'dismissed']

      - name: decision_recorded_at
        tests:
          - not_null

  - name: int_student_appearances
    description: "Run-scoped distinct learner appearances combining findings and group memberships. Student pseudonyms are never joined across runs without analysis_run_id."
    meta:
      grain: "one row per distinct student appearance within an analysis run"
    columns:
      - name: run_scoped_student_key
        description: "Composite run-scoped learner key derived from analysis_run_id and student_id."
        tests:
          - unique
          - not_null

      - name: analysis_run_id
        tests:
          - not_null

      - name: student_id
        tests:
          - not_null

  - name: int_concept_prevalence
    description: "Prevalence calculation at misconception-cluster grain with explicit numerator and denominator."
    meta:
      grain: "one row per misconception cluster within an analysis run"
    columns:
      - name: analysis_run_id
        tests:
          - not_null

      - name: cluster_id
        tests:
          - not_null

      - name: affected_student_count
        tests:
          - not_null

      - name: submission_count
        tests:
          - not_null

      - name: prevalence_rate

  - name: int_ingestion_reconciliation
    description: "Canonical durable ingestion attempts used for analytical reconciliation. Each audit attempt remains a separate fact even when multiple attempts share the same event_id. Internal PostgreSQL transaction retries are not inferred from durable audit history."
    meta:
      grain: "one row per durable ingestion audit attempt"
    columns:
      - name: attempt_id
        description: "Immutable identifier of the durable ingestion audit attempt."
        tests:
          - unique
          - not_null

      - name: event_id
        description: "Analytical event identity associated with the attempt. Multiple attempts may legitimately share the same event_id."
        tests:
          - not_null

      - name: event_type
        description: "Analytical event type associated with the ingestion attempt."
        tests:
          - not_null

      - name: outcome
        description: "Outcome of this specific durable logical ingestion attempt."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['accepted', 'duplicate', 'conflict', 'rejected', 'failed']

      - name: rejection_reason
        description: "Failure or rejection reason when applicable. Null for outcomes that do not require a reason."

      - name: processed_at
        description: "Timestamp when this durable ingestion attempt was processed."
        tests:
          - not_null