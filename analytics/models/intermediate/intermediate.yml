version: 2

models:
  - name: int_teacher_decision_ranked
    description: "Independently reconstructed current teacher decision state per target, derived from immutable event history using decision_recorded_at descending and event_id tie-breaking descending."
    meta:
      grain: "one row per teacher decision target per analysis run"
    columns:
      - name: event_id
        description: "Event ID of the winning decision."
        tests:
          - unique
          - not_null
      - name: analysis_run_id
        tests:
          - not_null
      - name: target_type
        tests:
          - not_null
      - name: target_id
        tests:
          - not_null
      - name: teacher_decision
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['accepted', 'edited', 'dismissed']
      - name: decision_recorded_at
        tests:
          - not_null

  - name: int_student_appearances
    description: "Run-scoped distinct learner appearances combining findings and group memberships. Never joins student IDs across runs without analysis_run_id."
    meta:
      grain: "one row per distinct student appearance within an analysis run"
    columns:
      - name: run_scoped_student_key
        description: "Composite key (analysis_run_id_student_id) enforcing run-scoped pseudonymity."
        tests:
          - unique
          - not_null
      - name: analysis_run_id
        tests:
          - not_null
      - name: student_id
        tests:
          - not_null

  - name: int_concept_prevalence
    description: "Prevalence calculations at misconception cluster grain with explicit numerator and denominator."
    meta:
      grain: "one row per misconception cluster within an analysis run"
    columns:
      - name: analysis_run_id
        tests:
          - not_null
      - name: cluster_id
        tests:
          - not_null
      - name: affected_student_count
        tests:
          - not_null
      - name: submission_count
        tests:
          - not_null
      - name: prevalence_rate

  - name: int_ingestion_reconciliation
    description: "Logical ingestion attempts reconciling internal transaction retries into a single logical outcome per event_id."
    meta:
      grain: "one row per unique event_id in ingestion audit log"
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: final_outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['accepted', 'duplicate', 'conflict', 'rejected']
      - name: total_attempts
        tests:
          - not_null
      - name: first_attempt_at
        tests:
          - not_null
      - name: last_attempt_at
        tests:
          - not_null
