name: "lotuslearn_analytics"
version: "1.0.0"
config-version: 2

require-dbt-version: [">=1.12.0", "<2.0.0"]

profile: "lotuslearn"

model-paths:
  - "models"

analysis-paths:
  - "analyses"

test-paths:
  - "tests"

seed-paths:
  - "seeds"

macro-paths:
  - "macros"

snapshot-paths:
  - "snapshots"

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  lotuslearn_analytics:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts